<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>WorkLog</title>
  <!-- Standalone build: double-click this file in Edge or Chrome; no local server is required. -->
  <style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #fafbfc;
  --text: #17202a;
  --muted: #687385;
  --border: #e3e7ed;
  --border-strong: #d5dae2;
  --sidebar: #171c23;
  --sidebar-text: #ecf0f5;
  --sidebar-muted: #aeb8c5;
  --sidebar-active: #2a333e;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #eff6ff;
  --danger: #dc2626;
  --shadow: 0 14px 40px rgba(20, 28, 38, 0.12);
  --meeting: #7c3aed;
  --meeting-bg: #f3e8ff;
  --work: #16803b;
  --work-bg: #e8f7ee;
  --conversation: #c76a18;
  --conversation-bg: #fff1df;
  --decision: #b4234d;
  --decision-bg: #fde8ef;
  --achievement: #9a6700;
  --achievement-bg: #fff7d6;
  --note: #4f6075;
  --note-bg: #edf1f5;
}

html[data-theme='dark'] {
  color-scheme: dark;
  --bg: #0f1318;
  --panel: #151a20;
  --panel-2: #11161b;
  --text: #eef2f7;
  --muted: #9aa6b5;
  --border: #2a333d;
  --border-strong: #394552;
  --sidebar: #0b0f14;
  --sidebar-text: #edf2f7;
  --sidebar-muted: #94a0ad;
  --sidebar-active: #1c252e;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --accent-soft: #172a45;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  --meeting: #c4a0ff;
  --meeting-bg: #2d2140;
  --work: #7ed99d;
  --work-bg: #163123;
  --conversation: #f0b169;
  --conversation-bg: #3b2b19;
  --decision: #f58aa8;
  --decision-bg: #3b1e28;
  --achievement: #f2cf68;
  --achievement-bg: #382f18;
  --note: #b9c3cf;
  --note-bg: #242c35;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.sidebar {
  position: sticky; top: 0; height: 100vh; padding: 18px 12px;
  display: flex; flex-direction: column; background: var(--sidebar); color: var(--sidebar-text);
}
.brand {
  appearance: none; border: 0; background: transparent; color: inherit; padding: 6px 9px 20px;
  display: flex; align-items: center; gap: 10px; font-weight: 720; font-size: 16px; text-align: left;
}
.brand-mark {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, #f2f6ff, #b7c8ea); color: #17202a; font-size: 13px; font-weight: 900;
}
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-item {
  appearance: none; border: 0; background: transparent; color: var(--sidebar-muted);
  display: flex; gap: 11px; align-items: center; padding: 9px 10px; width: 100%; border-radius: 8px; text-align: left;
}
.nav-item:hover { color: var(--sidebar-text); background: rgba(255,255,255,.05); }
.nav-item.active { color: var(--sidebar-text); background: var(--sidebar-active); }
.nav-icon { width: 17px; opacity: .9; font-size: 13px; text-align: center; }
.nav-separator { height: 1px; background: rgba(255,255,255,.08); margin: 9px 8px; }
.sidebar-footer { margin-top: auto; }

.main { min-width: 0; }
.topbar {
  min-height: 92px; padding: 20px 28px 15px; border-bottom: 1px solid var(--border); background: var(--panel);
  display: flex; align-items: center; justify-content: space-between; gap: 18px; position: sticky; top: 0; z-index: 20;
}
.topbar-copy { min-width: 0; }
.eyebrow { min-height: 16px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .075em; font-weight: 700; }
h1 { margin: 2px 0 0; font-size: 23px; line-height: 1.2; letter-spacing: -.025em; }
#page-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.primary-btn, .secondary-btn, .icon-btn, .ghost-btn, .danger-btn {
  border-radius: 8px; min-height: 34px; border: 1px solid var(--border-strong); padding: 7px 11px; background: var(--panel); color: var(--text);
}
.primary-btn { background: var(--accent); border-color: var(--accent); color: white; font-weight: 700; }
.primary-btn:hover { background: var(--accent-hover); }
.secondary-btn:hover, .icon-btn:hover, .ghost-btn:hover { background: var(--panel-2); }
.icon-btn { width: 34px; padding: 0; display: grid; place-items: center; font-size: 20px; }
.ghost-btn { border-color: transparent; background: transparent; color: var(--muted); }
.danger-btn { color: var(--danger); border-color: color-mix(in srgb, var(--danger), transparent 65%); background: transparent; }
.link-btn { padding: 0; border: 0; background: transparent; color: var(--accent); font-weight: 650; }

#notice-area { padding: 0 28px; }
.notice {
  margin-top: 18px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.notice strong { display: block; margin-bottom: 2px; }
.notice-copy { color: var(--muted); font-size: 12px; }
.content { padding: 22px 28px 48px; max-width: 1220px; margin: 0 auto; }

.empty-state {
  min-height: 360px; border: 1px dashed var(--border-strong); border-radius: 14px; background: var(--panel);
  display: grid; place-items: center; text-align: center; padding: 40px;
}
.empty-state-inner { max-width: 430px; }
.empty-state-icon { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; margin: 0 auto 14px; background: var(--accent-soft); color: var(--accent); font-size: 23px; }
.empty-state h2 { margin: 0 0 7px; font-size: 18px; }
.empty-state p { margin: 0 0 18px; color: var(--muted); }

.week-card, .panel, .detail-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
}
.week-card { overflow: hidden; }
.day-section { display: grid; grid-template-columns: 86px minmax(0,1fr); border-bottom: 1px solid var(--border); }
.day-section:last-child { border-bottom: 0; }
.day-label { padding: 17px 14px 16px 16px; border-right: 1px solid var(--border); background: var(--panel-2); }
.day-name { font-weight: 750; }
.day-date { color: var(--muted); font-size: 11px; margin-top: 1px; }
.day-entries { padding: 7px 0; min-height: 68px; }
.day-empty { height: 100%; min-height: 54px; display: flex; align-items: center; padding: 0 18px; color: var(--muted); font-size: 12px; }
.entry-row {
  width: 100%; appearance: none; background: transparent; border: 0; color: inherit; text-align: left;
  display: grid; grid-template-columns: 58px minmax(170px, .8fr) minmax(240px, 1.3fr); gap: 12px; padding: 10px 18px;
}
.entry-row:hover { background: var(--panel-2); }
.entry-time { color: var(--muted); font-size: 11px; padding-top: 2px; }
.entry-title { font-weight: 700; min-width: 0; }
.entry-title-line { display: flex; align-items: center; gap: 7px; min-width: 0; }
.entry-title-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.entry-preview { color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; padding-top: 2px; }
.type-pill, .topic-pill {
  display: inline-flex; align-items: center; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-radius: 999px; padding: 2px 7px; font-size: 10px; line-height: 1.35; font-weight: 650;
}
.type-meeting { color: var(--meeting); background: var(--meeting-bg); }
.type-work { color: var(--work); background: var(--work-bg); }
.type-conversation { color: var(--conversation); background: var(--conversation-bg); }
.type-decision { color: var(--decision); background: var(--decision-bg); }
.type-achievement { color: var(--achievement); background: var(--achievement-bg); }
.type-note { color: var(--note); background: var(--note-bg); }
.topic-pill { color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); }

.today-stack { display: grid; gap: 8px; }
.today-entry {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  display: grid; grid-template-columns: 62px minmax(0,1fr); gap: 12px;
}
.today-entry:hover { border-color: var(--border-strong); }

.month-tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.month-tab { border: 0; background: transparent; color: var(--muted); padding: 0 0 10px; font-weight: 650; border-bottom: 2px solid transparent; }
.month-tab.active { color: var(--accent); border-color: var(--accent); }
.month-list { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.month-row { display: grid; grid-template-columns: 80px 58px minmax(170px,.75fr) 110px minmax(180px,1fr); gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--border); align-items: center; }
.month-row:last-child { border-bottom: 0; }
.month-date, .month-time { color: var(--muted); font-size: 11px; }
.month-row-title { font-weight: 680; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.search-toolbar { display: grid; gap: 10px; margin-bottom: 16px; }
.search-input-wrap { position: relative; }
.search-input-wrap input { padding-left: 36px; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.search-results { display: grid; gap: 8px; }
.search-result { display: grid; grid-template-columns: minmax(0,1fr) 120px; gap: 10px; padding: 13px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.search-result:hover { border-color: var(--border-strong); }
.search-result-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.search-result-title { font-weight: 720; }
.search-result-preview { color: var(--muted); font-size: 12px; }
.search-result-date { color: var(--muted); text-align: right; font-size: 11px; }

.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; }
.stat-card, .entity-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.stat-number { font-size: 26px; font-weight: 780; letter-spacing: -.03em; }
.stat-label { color: var(--muted); font-size: 12px; margin-top: 1px; }
.entity-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.entity-name { font-weight: 700; }
.entity-meta { color: var(--muted); font-size: 11px; }

.analytics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.chart-panel { padding: 18px; }
.chart-title { font-weight: 700; margin-bottom: 16px; }
.bar-chart { height: 190px; display: flex; gap: 9px; align-items: end; border-bottom: 1px solid var(--border); padding: 0 2px; }
.bar-wrap { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 5px; height: 100%; }
.bar { width: min(30px, 72%); min-height: 2px; border-radius: 4px 4px 0 0; background: color-mix(in srgb, var(--accent), white 25%); }
.bar.active { background: var(--accent); }
.bar-label { color: var(--muted); font-size: 10px; }

.settings-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(280px,.7fr); gap: 18px; }
.panel { padding: 18px; }
.panel h2 { font-size: 15px; margin: 0 0 5px; }
.panel p { color: var(--muted); margin: 0 0 15px; font-size: 12px; }
.setting-row { padding: 14px 0; display: flex; justify-content: space-between; gap: 15px; align-items: center; border-bottom: 1px solid var(--border); }
.setting-row:last-child { border-bottom: 0; }
.setting-title { font-weight: 680; }
.setting-copy { color: var(--muted); font-size: 11px; margin-top: 2px; }
.button-row { display: flex; gap: 8px; flex-wrap: wrap; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(9, 14, 21, .53); backdrop-filter: blur(2px); z-index: 100; display: grid; place-items: center; padding: 18px; }
.modal { width: min(760px, 100%); max-height: calc(100vh - 36px); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.modal.modal-sm { width: min(620px, 100%); }
.modal-header { padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); }
.modal-header h2 { margin: 0; font-size: 19px; }
.modal-body { padding: 20px; }
.modal-footer { padding: 13px 20px; display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--border); background: var(--panel-2); }
.modal-footer-right { display: flex; gap: 8px; }
.close-btn { border: 0; background: transparent; color: var(--muted); font-size: 20px; width: 32px; height: 32px; border-radius: 8px; }
.close-btn:hover { background: var(--panel-2); }
.entry-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.entry-type-choice { text-align: center; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 12px; color: var(--text); }
.entry-type-choice:hover { border-color: var(--border-strong); background: var(--panel-2); transform: translateY(-1px); }
.choice-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin: 0 auto 10px; font-size: 18px; }
.choice-label { display: block; font-weight: 720; }
.choice-description { display: block; color: var(--muted); margin-top: 4px; font-size: 11px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: grid; gap: 6px; }
.field.span-2 { grid-column: 1 / -1; }
.field label { font-size: 11px; font-weight: 700; color: var(--muted); }
.field-help { color: var(--muted); font-size: 10px; }
input, textarea, select {
  width: 100%; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); border-radius: 8px; padding: 9px 10px; outline: none;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent), transparent 85%); }
.field-section { grid-column: 1 / -1; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 12px; font-weight: 720; }

.detail-header-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 11px; margin-bottom: 8px; }
.detail-title { font-size: 22px; margin: 0 0 8px; }
.detail-section { padding: 14px 0; border-top: 1px solid var(--border); }
.detail-section:first-of-type { border-top: 0; }
.detail-section h3 { margin: 0 0 8px; font-size: 12px; }
.detail-section p { margin: 0; white-space: pre-wrap; }
.detail-section ul { margin: 0; padding-left: 18px; }
.detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.followup-list { list-style: none !important; padding-left: 0 !important; display: grid; gap: 6px; }
.followup-item { display: flex; align-items: center; gap: 8px; }
.followup-item.done { text-decoration: line-through; color: var(--muted); }

.toast-root { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 200; }
.toast { min-width: 220px; max-width: 360px; padding: 11px 13px; border-radius: 9px; color: var(--text); background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); }
.toast.error { border-color: color-mix(in srgb, var(--danger), transparent 50%); }

.mobile-add { display: none; }

@media (max-width: 900px) {
  .app-shell { grid-template-columns: 72px minmax(0,1fr); }
  .sidebar { padding-inline: 8px; }
  .brand span:last-child, .nav-item span:last-child { display: none; }
  .brand { justify-content: center; padding-inline: 0; }
  .nav-item { justify-content: center; padding-inline: 0; }
  .nav-icon { width: auto; }
  .topbar { padding-inline: 18px; }
  .content, #notice-area { padding-left: 18px; padding-right: 18px; }
  .entry-row { grid-template-columns: 50px minmax(150px,.8fr) minmax(180px,1fr); }
  .month-row { grid-template-columns: 65px 50px minmax(150px,1fr) 90px; }
  .month-row > :last-child { display: none; }
  .analytics-grid { grid-template-columns: repeat(2,1fr); }
  .settings-grid { grid-template-columns: 1fr; }
}

@media (max-width: 640px) {
  .app-shell { display: block; }
  .sidebar { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; top: auto; height: 62px; padding: 7px 8px; flex-direction: row; align-items: center; border-top: 1px solid rgba(255,255,255,.08); }
  .brand, .nav-separator, .sidebar-footer, .nav-item[data-view='people'], .nav-item[data-view='topics'], .nav-item[data-view='analytics'] { display: none; }
  .nav { width: 100%; flex-direction: row; justify-content: space-around; gap: 4px; }
  .nav-item { width: auto; flex: 1; display: grid; justify-items: center; gap: 2px; padding: 5px 2px; font-size: 10px; }
  .nav-item span:last-child { display: inline; }
  .nav-icon { font-size: 15px; }
  .main { padding-bottom: 68px; }
  .topbar { position: static; min-height: 76px; padding: 15px 14px 12px; align-items: flex-start; }
  .topbar-actions .icon-btn, .topbar-actions .secondary-btn { display: none; }
  .content, #notice-area { padding-left: 12px; padding-right: 12px; }
  .content { padding-top: 14px; }
  .day-section { grid-template-columns: 56px minmax(0,1fr); }
  .day-label { padding-inline: 9px; }
  .entry-row { grid-template-columns: 45px minmax(0,1fr); gap: 8px; padding-inline: 10px; }
  .entry-preview { grid-column: 2; }
  .entry-type-grid { grid-template-columns: repeat(2,1fr); }
  .form-grid { grid-template-columns: 1fr; }
  .field.span-2, .field-section { grid-column: auto; }
  .analytics-grid { grid-template-columns: 1fr 1fr; }
  .month-row { grid-template-columns: 55px minmax(0,1fr) 80px; }
  .month-row .month-time, .month-row > :last-child { display: none; }
  .search-result { grid-template-columns: 1fr; }
  .search-result-date { text-align: left; }
}

</style>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-view="week" aria-label="WorkLog home">
        <span class="brand-mark">W</span><span>WorkLog</span>
      </button>
      <nav class="nav" aria-label="Primary">
        <button class="nav-item" data-view="today"><span class="nav-icon">◉</span><span>Today</span></button>
        <button class="nav-item active" data-view="week"><span class="nav-icon">▣</span><span>This Week</span></button>
        <button class="nav-item" data-view="month"><span class="nav-icon">□</span><span>This Month</span></button>
        <button class="nav-item" data-view="search"><span class="nav-icon">⌕</span><span>Search</span></button>
        <div class="nav-separator"></div>
        <button class="nav-item" data-view="people"><span class="nav-icon">♙</span><span>People</span></button>
        <button class="nav-item" data-view="topics"><span class="nav-icon">◇</span><span>Topics</span></button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon">▥</span><span>Analytics</span></button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="page-title">This Week</h1>
          <p id="page-subtitle"></p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="previous-btn" title="Previous period" aria-label="Previous period">‹</button>
          <button class="icon-btn" id="next-btn" title="Next period" aria-label="Next period">›</button>
          <button class="secondary-btn" id="today-btn">Today</button>
          <button class="primary-btn" id="add-btn"><span>＋</span> Add</button>
        </div>
      </header>
      <section id="notice-area"></section>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script>

// ---- src/utils.js ----
const ENTRY_META = {
  meeting: { label: 'Meeting', className: 'type-meeting', icon: '♟', description: 'Notes, decisions, participants' },
  work: { label: 'Work done', className: 'type-work', icon: '▰', description: 'What you worked on, outcomes' },
  conversation: { label: 'Conversation', className: 'type-conversation', icon: '◌', description: 'Informal discussions, 1:1s' },
  decision: { label: 'Decision', className: 'type-decision', icon: '✓', description: 'Key decisions and rationale' },
  achievement: { label: 'Achievement', className: 'type-achievement', icon: '★', description: 'Milestones and impact' },
  note: { label: 'Quick note', className: 'type-note', icon: '▤', description: 'Miscellaneous notes' }
};

const pad = value => String(value).padStart(2, '0');

function toLocalDateInput(date = new Date()) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function parseLocalDate(value) {
  const [y, m, d] = String(value).split('-').map(Number);
  return new Date(y, m - 1, d);
}

function startOfISOWeek(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  d.setHours(0, 0, 0, 0);
  return d;
}

function endOfISOWeek(date) {
  const d = startOfISOWeek(date);
  d.setDate(d.getDate() + 6);
  d.setHours(23, 59, 59, 999);
  return d;
}

function getISOWeekInfo(date = new Date()) {
  const local = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const utc = new Date(Date.UTC(local.getFullYear(), local.getMonth(), local.getDate()));
  const day = utc.getUTCDay() || 7;
  utc.setUTCDate(utc.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((((utc - yearStart) / 86400000) + 1) / 7));
  const year = utc.getUTCFullYear();
  const start = startOfISOWeek(local);
  const end = endOfISOWeek(local);
  return { year, week, key: `${year}-W${pad(week)}`, startDate: toLocalDateInput(start), endDate: toLocalDateInput(end) };
}

function createEmptyWeek(date = new Date()) {
  const info = getISOWeekInfo(date);
  return {
    schemaVersion: 1,
    week: info.key,
    startDate: info.startDate,
    endDate: info.endDate,
    entries: [],
    weeklyReflection: { highlights: [], outcomes: [], challenges: [], learnings: [] }
  };
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function addMonths(date, months) {
  const d = new Date(date);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + months);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return d;
}

function formatDate(date, options = {}) {
  return new Intl.DateTimeFormat('en-GB', options).format(date);
}

function formatRange(start, end) {
  const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
  if (sameMonth) return `${start.getDate()}–${end.getDate()} ${formatDate(end, { month: 'short', year: 'numeric' })}`;
  return `${formatDate(start, { day: 'numeric', month: 'short' })} – ${formatDate(end, { day: 'numeric', month: 'short', year: 'numeric' })}`;
}

function splitLines(value = '') {
  return String(value).split('\n').map(v => v.trim()).filter(Boolean);
}

function joinLines(value) {
  if (!value) return '';
  return Array.isArray(value) ? value.join('\n') : String(value);
}

function normalizeList(value) {
  if (!value) return [];
  if (Array.isArray(value)) return value.map(v => String(v).trim()).filter(Boolean);
  return String(value).split(',').map(v => v.trim()).filter(Boolean);
}

function escapeHTML(value = '') {
  return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
}

function sortEntries(entries) {
  return [...entries].sort((a, b) => {
    const aKey = `${a.date || ''}T${a.time || '99:99'}`;
    const bKey = `${b.date || ''}T${b.time || '99:99'}`;
    return aKey.localeCompare(bKey);
  });
}

function entryPreview(entry) {
  const source = entry.summary || entry.decision || entry.content || entry.outcome || entry.notes?.[0] || entry.discussion?.[0] || entry.impact || '';
  return String(source).replace(/\s+/g, ' ').trim();
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function uid() {
  if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
  return `entry-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}


// ---- src/schema.js ----
const CURRENT_SCHEMA_VERSION = 1;
const ENTRY_TYPES = new Set(['meeting', 'work', 'conversation', 'decision', 'achievement', 'note']);
const LIST_FIELDS = ['topics', 'tags', 'participants', 'discussion', 'notes', 'contribution', 'decisions', 'details'];
const REF_TYPES = new Set(['jira', 'link', 'document', 'other']);
const TOP_LEVEL_FIELDS = new Set(['schemaVersion', 'week', 'startDate', 'endDate', 'entries', 'weeklyReflection']);
const REFLECTION_FIELDS = ['highlights', 'outcomes', 'challenges', 'learnings'];

class SchemaValidationError extends Error {
  constructor(message, issues = []) {
    super(message);
    this.name = 'SchemaValidationError';
    this.issues = issues;
  }
}

function clone(value) {
  return globalThis.structuredClone ? structuredClone(value) : JSON.parse(JSON.stringify(value));
}

function isObject(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function isValidDateString(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ''))) return false;
  const parsed = parseLocalDate(value);
  return Number.isFinite(parsed.getTime()) &&
    parsed.getFullYear() === Number(value.slice(0, 4)) &&
    parsed.getMonth() + 1 === Number(value.slice(5, 7)) &&
    parsed.getDate() === Number(value.slice(8, 10));
}

function validateStringList(value, path, issues) {
  if (!Array.isArray(value)) {
    issues.push(`${path} must be an array.`);
    return;
  }
  value.forEach((item, index) => {
    if (typeof item !== 'string') issues.push(`${path}[${index}] must be a string.`);
  });
}

function migrateV0ToV1(input) {
  const week = clone(input);
  week.schemaVersion = 1;
  week.entries = Array.isArray(week.entries) ? week.entries : [];
  week.weeklyReflection = {
    highlights: [], outcomes: [], challenges: [], learnings: [],
    ...(isObject(week.weeklyReflection) ? week.weeklyReflection : {})
  };
  for (const field of REFLECTION_FIELDS) {
    if (!Array.isArray(week.weeklyReflection[field])) week.weeklyReflection[field] = [];
  }
  return week;
}

const MIGRATIONS = new Map([[0, migrateV0ToV1]]);

function migrateWeek(input) {
  if (!isObject(input)) throw new SchemaValidationError('Weekly data must be a JSON object.');
  let week = clone(input);
  let version = week.schemaVersion == null ? 0 : Number(week.schemaVersion);
  if (!Number.isInteger(version) || version < 0) throw new SchemaValidationError('schemaVersion must be a non-negative integer.');
  if (version > CURRENT_SCHEMA_VERSION) {
    throw new SchemaValidationError(`This file uses schema version ${version}, but this WorkLog supports up to version ${CURRENT_SCHEMA_VERSION}.`);
  }
  while (version < CURRENT_SCHEMA_VERSION) {
    const migration = MIGRATIONS.get(version);
    if (!migration) throw new SchemaValidationError(`No migration exists from schema version ${version}.`);
    week = migration(week);
    version = Number(week.schemaVersion);
  }
  return week;
}

function validateWeek(input) {
  const issues = [];
  if (!isObject(input)) return { valid: false, issues: ['Weekly data must be a JSON object.'] };

  for (const key of Object.keys(input)) {
    if (!TOP_LEVEL_FIELDS.has(key)) issues.push(`Unknown top-level field: ${key}.`);
  }
  if (input.schemaVersion !== CURRENT_SCHEMA_VERSION) issues.push(`schemaVersion must be ${CURRENT_SCHEMA_VERSION}.`);
  if (!/^\d{4}-W(0[1-9]|[1-4]\d|5[0-3])$/.test(String(input.week || ''))) issues.push('week must use YYYY-Www format with week 01–53.');
  if (!isValidDateString(input.startDate)) issues.push('startDate must be a valid YYYY-MM-DD date.');
  if (!isValidDateString(input.endDate)) issues.push('endDate must be a valid YYYY-MM-DD date.');

  if (isValidDateString(input.startDate) && /^\d{4}-W\d{2}$/.test(String(input.week || ''))) {
    const info = getISOWeekInfo(parseLocalDate(input.startDate));
    if (info.key !== input.week) issues.push(`startDate belongs to ${info.key}, not ${input.week}.`);
    if (info.startDate !== input.startDate) issues.push('startDate must be the Monday of the ISO week.');
    if (info.endDate !== input.endDate) issues.push('endDate must be the Sunday of the ISO week.');
  }

  if (!Array.isArray(input.entries)) {
    issues.push('entries must be an array.');
  } else {
    const ids = new Set();
    input.entries.forEach((entry, index) => {
      const path = `entries[${index}]`;
      if (!isObject(entry)) { issues.push(`${path} must be an object.`); return; }
      if (typeof entry.id !== 'string' || !entry.id.trim()) issues.push(`${path}.id is required.`);
      else if (ids.has(entry.id)) issues.push(`${path}.id duplicates another entry id.`);
      else ids.add(entry.id);
      if (!ENTRY_TYPES.has(entry.type)) issues.push(`${path}.type is invalid.`);
      if (!isValidDateString(entry.date)) issues.push(`${path}.date must be a valid YYYY-MM-DD date.`);
      else if (/^\d{4}-W\d{2}$/.test(String(input.week || '')) && getISOWeekInfo(parseLocalDate(entry.date)).key !== input.week) {
        issues.push(`${path}.date does not belong to ${input.week}.`);
      }
      if (entry.time != null && !/^([01]\d|2[0-3]):[0-5]\d$/.test(String(entry.time))) issues.push(`${path}.time must use HH:MM.`);
      if (typeof entry.title !== 'string' || !entry.title.trim()) issues.push(`${path}.title is required.`);
      for (const field of LIST_FIELDS) if (entry[field] != null) validateStringList(entry[field], `${path}.${field}`, issues);
      if (entry.followUps != null) {
        if (!Array.isArray(entry.followUps)) issues.push(`${path}.followUps must be an array.`);
        else entry.followUps.forEach((followUp, i) => {
          if (!isObject(followUp) || typeof followUp.text !== 'string' || !followUp.text.trim()) issues.push(`${path}.followUps[${i}].text is required.`);
          if (followUp?.done != null && typeof followUp.done !== 'boolean') issues.push(`${path}.followUps[${i}].done must be boolean.`);
        });
      }
      if (entry.references != null) {
        if (!Array.isArray(entry.references)) issues.push(`${path}.references must be an array.`);
        else entry.references.forEach((reference, i) => {
          if (!isObject(reference) || !REF_TYPES.has(reference.type) || typeof reference.value !== 'string' || !reference.value.trim()) {
            issues.push(`${path}.references[${i}] is invalid.`);
          }
        });
      }
    });
  }

  if (!isObject(input.weeklyReflection)) issues.push('weeklyReflection must be an object.');
  else {
    for (const key of Object.keys(input.weeklyReflection)) {
      if (!REFLECTION_FIELDS.includes(key)) issues.push(`Unknown weeklyReflection field: ${key}.`);
    }
    for (const field of REFLECTION_FIELDS) validateStringList(input.weeklyReflection[field], `weeklyReflection.${field}`, issues);
  }

  return { valid: issues.length === 0, issues };
}

function normalizeWeek(input, source = 'Weekly file') {
  const migrated = migrateWeek(input);
  const result = validateWeek(migrated);
  if (!result.valid) throw new SchemaValidationError(`${source} is not valid WorkLog data.`, result.issues);
  return migrated;
}


// ---- src/backup.js ----
const BACKUP_FORMAT_VERSION = 1;

function createBackupPayload(weeks) {
  const normalized = weeks.map((week, index) => normalizeWeek(week, `Backup week ${index + 1}`));
  return {
    backupFormatVersion: BACKUP_FORMAT_VERSION,
    exportedAt: new Date().toISOString(),
    weeks: normalized
  };
}

function parseImportDocument(text, sourceName = 'JSON file') {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (error) {
    throw new Error(`${sourceName} is not valid JSON: ${error.message}`);
  }

  if (parsed && Array.isArray(parsed.weeks)) {
    const version = parsed.backupFormatVersion ?? parsed.schemaVersion ?? 1;
    if (version !== BACKUP_FORMAT_VERSION) throw new Error(`${sourceName} uses unsupported backup format version ${version}.`);
    return { kind: 'backup', weeks: parsed.weeks.map((week, index) => normalizeWeek(week, `${sourceName} week ${index + 1}`)) };
  }

  return { kind: 'week', weeks: [normalizeWeek(parsed, sourceName)] };
}

function mergeImportDocuments(documents) {
  const byWeek = new Map();
  let includesBackup = false;
  for (const document of documents) {
    if (document.kind === 'backup') includesBackup = true;
    for (const week of document.weeks) {
      if (byWeek.has(week.week)) throw new Error(`The selected files contain ${week.week} more than once.`);
      byWeek.set(week.week, week);
    }
  }
  return { kind: includesBackup ? 'backup' : 'weeks', weeks: [...byWeek.values()].sort((a, b) => a.week.localeCompare(b.week)) };
}


// ---- src/storage.js ----
const DB_NAME = 'worklog-local';
const STORE = 'handles';
const KEY = 'workspace-directory';
const BACKUP_DIR = 'backups';
const RECOVERY_DIR = 'recovery';

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => request.result.createObjectStore(STORE);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbDelete(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

const supportsFileSystemAccess = typeof window !== 'undefined' && 'showDirectoryPicker' in window;

async function getRememberedDirectory() {
  if (!supportsFileSystemAccess) return null;
  try { return await idbGet(KEY); } catch { return null; }
}

async function chooseDirectory() {
  if (!supportsFileSystemAccess) throw new Error('Direct folder access is not supported in this browser. Use Microsoft Edge or Google Chrome on desktop.');
  const handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'worklog-data' });
  try { await idbSet(KEY, handle); } catch (error) { console.warn('Folder connected, but could not remember it for next time.', error); }
  return handle;
}

async function forgetDirectory() {
  await idbDelete(KEY);
}

async function ensurePermission(handle, prompt = false) {
  if (!handle) return false;
  const options = { mode: 'readwrite' };
  if ((await handle.queryPermission(options)) === 'granted') return true;
  if (prompt && (await handle.requestPermission(options)) === 'granted') return true;
  return false;
}

async function getYearDirectory(root, year, create = false) {
  return root.getDirectoryHandle(String(year), { create });
}

async function getNestedYearDirectory(root, parentName, year, create = false) {
  const parent = await root.getDirectoryHandle(parentName, { create });
  return parent.getDirectoryHandle(String(year), { create });
}

async function readText(handle) {
  const file = await handle.getFile();
  return file.text();
}

async function writeText(handle, text) {
  const writable = await handle.createWritable();
  try {
    await writable.write(text);
    await writable.close();
  } catch (error) {
    try { await writable.abort?.(); } catch {}
    throw error;
  }
}

async function writeJSONFile(directory, filename, data) {
  const handle = await directory.getFileHandle(filename, { create: true });
  await writeText(handle, `${JSON.stringify(data, null, 2)}\n`);
  return handle;
}

async function readValidatedHandle(handle, source) {
  const text = await readText(handle);
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (error) { throw new Error(`${source} contains invalid JSON: ${error.message}`); }
  return { text, week: normalizeWeek(parsed, source) };
}

async function getBackupHandle(root, weekKey, create = false) {
  const year = Number(weekKey.slice(0, 4));
  const dir = await getNestedYearDirectory(root, BACKUP_DIR, year, create);
  return dir.getFileHandle(`${weekKey}.json`, { create });
}

async function saveRecoveryCopy(root, weekKey, rawText, parent = RECOVERY_DIR) {
  const year = Number(weekKey.slice(0, 4));
  const dir = await getNestedYearDirectory(root, parent, year, true);
  const stamp = `${new Date().toISOString().replace(/[:.]/g, '-')}-${globalThis.crypto?.randomUUID?.() || Math.random().toString(16).slice(2)}`;
  const handle = await dir.getFileHandle(`${weekKey}-${stamp}.json`, { create: true });
  await writeText(handle, rawText);
  if (await readText(handle) !== rawText) throw new Error('Recovery copy failed verification. Original file was not replaced.');
}

function verifyWeekKey(week, key) {
  if (week.week !== key) throw new Error(`File ${key}.json contains ${week.week}. Rename or repair the file before continuing.`);
  return week;
}

async function recoverFromBackup(root, weekKey, corruptText) {
  try {
    const backupHandle = await getBackupHandle(root, weekKey, false);
    const { week } = await readValidatedHandle(backupHandle, `Recovery copy for ${weekKey}`);
    verifyWeekKey(week, weekKey);
    await saveRecoveryCopy(root, weekKey, corruptText);
    const yearDir = await getYearDirectory(root, Number(weekKey.slice(0, 4)), true);
    await writeJSONFile(yearDir, `${weekKey}.json`, week);
    return week;
  } catch {
    return null;
  }
}

async function readWeekHandleWithRecovery(root, weekKey, fileHandle) {
  const rawText = await readText(fileHandle);
  try {
    let parsed;
    try { parsed = JSON.parse(rawText); }
    catch (error) { throw new Error(`Invalid JSON: ${error.message}`); }
    if (Number(parsed?.schemaVersion) > 1) throw new Error('This file requires a newer WorkLog version.');
    return verifyWeekKey(normalizeWeek(parsed, weekKey), weekKey);
  } catch (error) {
    if (error?.name === 'NotAllowedError' || /newer WorkLog|Rename or repair/.test(error.message)) throw error;
    const recovered = await recoverFromBackup(root, weekKey, rawText);
    if (recovered) {
      console.warn(`${weekKey} was invalid and has been restored from its last known-good recovery copy.`);
      return recovered;
    }
    throw new Error(`${weekKey}.json is unreadable and no valid recovery copy is available. WorkLog did not modify it. ${error.message}`);
  }
}

async function readWeek(root, date) {
  const info = getISOWeekInfo(date);
  try {
    const yearDir = await getYearDirectory(root, info.year, false);
    const fileHandle = await yearDir.getFileHandle(`${info.key}.json`, { create: false });
    return await readWeekHandleWithRecovery(root, info.key, fileHandle);
  } catch (error) {
    if (error?.name === 'NotFoundError') return createEmptyWeek(date);
    throw error;
  }
}

async function writeWeek(root, inputWeek, { allowRepair = false } = {}) {
  const week = normalizeWeek(inputWeek, 'Week being saved');
  const year = Number(week.week.slice(0, 4));
  const yearDir = await getYearDirectory(root, year, true);
  const filename = `${week.week}.json`;

  let hadExisting = false;
  // Preserve the currently valid canonical file before replacing it.
  try {
    const existingHandle = await yearDir.getFileHandle(filename, { create: false });
    hadExisting = true;
    const { week: existing, text } = await readValidatedHandle(existingHandle, `Existing ${filename}`);
    verifyWeekKey(existing, week.week);
    await saveRecoveryCopy(root, week.week, text, 'history');
    const backupDir = await getNestedYearDirectory(root, BACKUP_DIR, year, true);
    await writeJSONFile(backupDir, filename, existing);
  } catch (error) {
    if (error?.name !== 'NotFoundError') {
      if (!allowRepair) {
        // Normal edits never overwrite a canonical file that is already invalid.
        throw new Error(`Refusing to overwrite ${filename} because the existing file is not valid. ${error.message}`);
      }
      // An explicit import/restore may repair it, but preserve the damaged bytes first.
      const damagedHandle = await yearDir.getFileHandle(filename, { create: false });
      await saveRecoveryCopy(root, week.week, await readText(damagedHandle));
    }
  }

  let canonicalHandle;
  try {
    canonicalHandle = await writeJSONFile(yearDir, filename, week);
  } catch (error) {
    // getFileHandle(create:true) can leave an empty file when the first write fails.
    if (!hadExisting) {
      try {
        const created = await yearDir.getFileHandle(filename);
        if ((await readText(created)) === '') await yearDir.removeEntry(filename);
      } catch {}
    }
    throw error;
  }

  // Read-after-write verification. If this fails, put the previous backup back.
  try {
    const saved = await readValidatedHandle(canonicalHandle, `Saved ${filename}`);
    if (JSON.stringify(saved.week) !== JSON.stringify(week)) throw new Error('Saved content does not match the requested data.');
  } catch (error) {
    const recovered = await recoverFromBackup(root, week.week, await readText(canonicalHandle));
    throw new Error(recovered
      ? `Saving ${filename} failed verification. The previous valid version was restored.`
      : `Saving ${filename} failed verification and no recovery copy was available. ${error.message}`);
  }

  // Keep a last-known-good copy even after the first successful save.
  try {
    const backupDir = await getNestedYearDirectory(root, BACKUP_DIR, year, true);
    await writeJSONFile(backupDir, filename, week);
  } catch (error) {
    // The canonical save succeeded. Do not invite a retry that could duplicate an entry.
    const message = `${filename} was saved, but its recovery copy could not be refreshed. Export a backup when possible. ${error.message}`;
    console.warn(message);
    if (typeof window !== 'undefined') window.dispatchEvent(new CustomEvent('worklog-storage-warning', { detail: message }));
  }
  return week;
}

async function readAllWeeks(root) {
  const weeks = [];
  const failures = [];
  for await (const [yearName, yearHandle] of root.entries()) {
    if (yearHandle.kind !== 'directory' || !/^\d{4}$/.test(yearName)) continue;
    for await (const [name, handle] of yearHandle.entries()) {
      if (handle.kind !== 'file' || !/^\d{4}-W\d{2}\.json$/.test(name)) continue;
      const weekKey = name.slice(0, -5);
      try {
        if (weekKey.slice(0, 4) !== yearName) throw new Error(`${name} is in the wrong year folder.`);
        weeks.push(await readWeekHandleWithRecovery(root, weekKey, handle));
      } catch (error) {
        failures.push(error.message);
      }
    }
  }
  if (failures.length) throw new Error(`Some weekly files could not be read. No complete backup or overview can be produced. ${failures.join(' ')}`);
  return weeks.sort((a, b) => a.week.localeCompare(b.week));
}

async function inspectImportFiles(files) {
  const documents = [];
  for (const file of files) documents.push(parseImportDocument(await file.text(), file.name));
  return mergeImportDocuments(documents);
}

// Serializes cooperating tabs; version checks also reject stale entry edits.
async function withWriteLock(action) {
  if (globalThis.navigator?.locks) return navigator.locks.request('worklog-writes', action);
  const previous = pendingWrite;
  let release;
  pendingWrite = new Promise(resolve => { release = resolve; });
  await previous;
  try { return await action(); } finally { release(); }
}
let pendingWrite = Promise.resolve();

async function getImportConflicts(root, plan) {
  const conflicts = [];
  for (const week of plan.weeks) {
    try {
      const dir = await getYearDirectory(root, Number(week.week.slice(0, 4)));
      await dir.getFileHandle(`${week.week}.json`);
      conflicts.push(week.week);
    } catch (error) { if (error.name !== 'NotFoundError') throw error; }
  }
  return conflicts;
}

async function applyImport(root, plan, { overwrite = false } = {}) {
  return withWriteLock(async () => {
    const validated = mergeImportDocuments([{ kind: plan.kind, weeks: plan.weeks.map(week => normalizeWeek(week)) }]);
    const conflicts = await getImportConflicts(root, validated);
    if (conflicts.length && !overwrite) throw new Error(`Import would replace existing weeks: ${conflicts.join(', ')}. Confirm replacement first.`);
    const imported = [];
    try {
      for (const week of validated.weeks) {
        await writeWeek(root, week, { allowRepair: true });
        imported.push(week.week);
      }
    } catch (error) {
      throw new Error(`Import stopped. ${imported.length} of ${validated.weeks.length} weeks completed. Previous files are preserved under history/ or recovery/. ${error.message}`);
    }
    return imported;
  });
}

async function importWeekFiles(root, files, options) {
  return applyImport(root, await inspectImportFiles(files), options);
}

function assertUnchanged(actual, expected) {
  if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('This entry changed in another tab or file. Close the editor, refresh, and try again.');
}

async function saveEntry(root, entry, existing = null) {
  return withWriteLock(async () => {
    const targetDate = parseLocalDate(entry.date);
    const target = await readWeek(root, targetDate);
    let source;
    if (existing) {
      source = target.week === getISOWeekInfo(parseLocalDate(existing.date)).key ? target : await readWeek(root, parseLocalDate(existing.date));
      assertUnchanged(source.entries.find(item => item.id === existing.id), existing);
    }
    const collision = target.entries.find(item => item.id === entry.id);
    if (collision && source !== target) throw new Error('An entry with this ID already exists in the destination week. Review it before retrying.');
    target.entries = target.entries.filter(item => item.id !== entry.id);
    target.entries.push(entry);
    // Validate the entire destination before touching either file. Save destination first.
    normalizeWeek(target);
    await writeWeek(root, target);
    if (source && source !== target) {
      source.entries = source.entries.filter(item => item.id !== entry.id);
      try { await writeWeek(root, source); }
      catch (error) { throw new Error(`Entry saved in the destination week, but the original could not be removed. Check both weeks before retrying. ${error.message}`); }
    }
    return entry;
  });
}

async function removeEntry(root, entry) {
  return withWriteLock(async () => {
    const week = await readWeek(root, parseLocalDate(entry.date));
    assertUnchanged(week.entries.find(item => item.id === entry.id), entry);
    week.entries = week.entries.filter(item => item.id !== entry.id);
    return writeWeek(root, week);
  });
}

async function saveReflection(root, date, reflection, previous) {
  return withWriteLock(async () => {
    const week = await readWeek(root, date);
    if (JSON.stringify(week.weeklyReflection) !== JSON.stringify(previous)) throw new Error('Reflection changed elsewhere. Reopen it before saving.');
    week.weeklyReflection = reflection;
    return writeWeek(root, week);
  });
}

function downloadBackup(weeks) {
  const payload = createBackupPayload(weeks);
  const blob = new Blob([`${JSON.stringify(payload, null, 2)}\n`], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `worklog-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}


// ---- src/app.js ----
const state = {
  view: 'week',
  cursor: new Date(),
  directory: null,
  connected: false,
  currentWeek: createEmptyWeek(new Date()),
  allWeeks: [],
  search: '',
  searchType: 'all',
  monthTab: 'entries'
};

const els = {
  content: document.querySelector('#content'),
  notice: document.querySelector('#notice-area'),
  title: document.querySelector('#page-title'),
  subtitle: document.querySelector('#page-subtitle'),
  eyebrow: document.querySelector('#eyebrow'),
  previous: document.querySelector('#previous-btn'),
  next: document.querySelector('#next-btn'),
  today: document.querySelector('#today-btn'),
  add: document.querySelector('#add-btn'),
  modal: document.querySelector('#modal-root'),
  toast: document.querySelector('#toast-root')
};

const theme = localStorage.getItem('worklog-theme') || 'system';
applyTheme(theme);

function applyTheme(value) {
  const resolved = value === 'system'
    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : value;
  document.documentElement.dataset.theme = resolved;
}

matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
  if ((localStorage.getItem('worklog-theme') || 'system') === 'system') applyTheme('system');
});

function toast(message, error = false) {
  const node = document.createElement('div');
  node.className = `toast${error ? ' error' : ''}`;
  node.textContent = message;
  els.toast.appendChild(node);
  setTimeout(() => node.remove(), 3200);
}

let modalDirty = false;
let modalBusy = false;
let modalFocus = null;
function setModal(html) {
  modalFocus = document.activeElement;
  modalDirty = false;
  els.modal.innerHTML = html;
  const dialog = els.modal.querySelector('.modal');
  dialog?.setAttribute('role', 'dialog');
  dialog?.setAttribute('aria-modal', 'true');
  dialog?.setAttribute('aria-label', dialog.querySelector('h2')?.textContent || 'Entry');
  els.modal.querySelectorAll('.field').forEach((field, i) => {
    const input = field.querySelector('input, textarea, select');
    const label = field.querySelector('label');
    if (input && label) { input.id ||= `modal-field-${i}`; label.htmlFor = input.id; }
  });
  els.modal.querySelectorAll('.close-btn').forEach(button => button.setAttribute('aria-label', 'Close'));
  els.modal.querySelector('form')?.addEventListener('input', () => { modalDirty = true; });
  els.modal.querySelector('input, textarea, button')?.focus();
  const backdrop = els.modal.querySelector('.modal-backdrop');
  backdrop?.addEventListener('mousedown', event => {
    if (event.target === backdrop) closeModal();
  });
  els.modal.querySelectorAll('[data-close-modal]').forEach(btn => btn.addEventListener('click', closeModal));
}

function closeModal(force = false) {
  if (modalBusy) return;
  if (force !== true && modalDirty && !confirm('Discard unsaved changes?')) return;
  els.modal.innerHTML = ''; modalDirty = false; modalFocus?.focus();
}
window.addEventListener('beforeunload', event => { if (modalDirty || modalBusy) { event.preventDefault(); event.returnValue = ''; } });

async function initialize() {
  bindGlobalEvents();
  try {
    state.directory = await getRememberedDirectory();
    if (state.directory) state.connected = await ensurePermission(state.directory, false);
  } catch (error) { state.readError = error.message; }
  await refreshData(false);
}
window.addEventListener('worklog-storage-warning', event => { state.storageWarning = event.detail; toast(event.detail, true); });

function bindGlobalEvents() {
  document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', async () => {
    state.view = button.dataset.view;
    if (state.view === 'today') state.cursor = new Date();
    updateNavigation();
    await refreshData(false);
  }));

  els.previous.addEventListener('click', async () => {
    state.cursor = navigateCursor(-1);
    await refreshData(false);
  });
  els.next.addEventListener('click', async () => {
    state.cursor = navigateCursor(1);
    await refreshData(false);
  });
  els.today.addEventListener('click', async () => {
    state.cursor = new Date();
    await refreshData(false);
  });
  els.add.addEventListener('click', () => openEntryTypeModal());

  document.addEventListener('keydown', event => {
    if (!els.modal.innerHTML && (event.key === 'n' || event.key === 'N') && !event.metaKey && !event.ctrlKey && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) {
      event.preventDefault();
      openEntryTypeModal();
    }
    if (event.key === 'Tab' && els.modal.innerHTML) {
      const focusable = [...els.modal.querySelectorAll('button, input, textarea, select, a[href]')].filter(el => !el.disabled);
      const first = focusable[0], last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    }
    if (event.key === 'Escape' && els.modal.innerHTML) closeModal();
  });
}

function navigateCursor(direction) {
  if (state.view === 'today') return addDays(state.cursor, direction);
  if (state.view === 'week') return addDays(state.cursor, 7 * direction);
  if (state.view === 'month') return addMonths(state.cursor, direction);
  if (state.view === 'analytics') {
    const d = new Date(state.cursor);
    d.setFullYear(d.getFullYear() + direction);
    return d;
  }
  return addDays(state.cursor, 7 * direction);
}

async function connectFolder() {
  try {
    state.directory = await chooseDirectory();
    state.connected = await ensurePermission(state.directory, true);
    if (state.connected) {
      toast(`Connected to ${state.directory.name}`);
      await refreshData(true);
    }
  } catch (error) {
    if (error?.name !== 'AbortError') toast(error.message || 'Could not connect folder.', true);
  }
}

async function requestExistingPermission() {
  if (!state.directory) return connectFolder();
  try {
    state.connected = await ensurePermission(state.directory, true);
    await refreshData(true);
  } catch (error) { toast(error.message, true); }
}

async function refreshData(forceAll = false) {
  try {
    if (state.directory && !state.connected) state.connected = await ensurePermission(state.directory, false);
    if (state.connected) {
      state.readError = '';
      state.currentWeek = await readWeek(state.directory, state.cursor);
      if (forceAll || ['search','people','topics','analytics','month','settings'].includes(state.view)) {
        state.allWeeks = await readAllWeeks(state.directory);
      }
    } else {
      state.currentWeek = createEmptyWeek(state.cursor);
      state.allWeeks = [];
    }
  } catch (error) {
    console.error(error);
    if (error.name === 'NotAllowedError') state.connected = false;
    state.allWeeks = [];
    state.currentWeek = createEmptyWeek(state.cursor);
    state.readError = error.message;
    toast(error.message, true);
  }
  render();
}

function updateNavigation() {
  document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.view === state.view));
}

function render() {
  updateNavigation();
  renderNotice();
  const header = getHeader();
  els.eyebrow.textContent = header.eyebrow || '';
  els.title.textContent = header.title;
  els.subtitle.textContent = header.subtitle || '';
  els.previous.style.display = header.navigation === false ? 'none' : '';
  els.next.style.display = header.navigation === false ? 'none' : '';
  els.today.style.display = header.navigation === false ? 'none' : '';
  els.add.style.display = ['settings', 'analytics', 'people', 'topics'].includes(state.view) ? 'none' : '';

  const renderers = {
    today: renderToday, week: renderWeek, month: renderMonth, search: renderSearch,
    people: renderPeople, topics: renderTopics, analytics: renderAnalytics, settings: renderSettings
  };
  els.content.dataset.view = state.view;
  els.content.innerHTML = renderers[state.view]?.() || renderWeek();
  bindRenderedEvents();
}

function renderNotice() {
  if (state.storageWarning && !state.readError) {
    els.notice.innerHTML = `<div class="notice" role="alert">${escapeHTML(state.storageWarning)}</div>`;
    return;
  }
  if (state.connected && !state.readError) {
    els.notice.innerHTML = '';
    return;
  }
  if (state.connected && state.readError) {
    els.notice.innerHTML = `<div class="notice" role="alert">${escapeHTML(state.readError)} Use Settings to restore a valid backup, or repair the file in your folder.</div>`;
    return;
  }
  const supportedText = supportsFileSystemAccess
    ? 'Choose a local folder. WorkLog will read and write your weekly JSON files there.'
    : 'Direct folder access requires Microsoft Edge or Google Chrome on desktop.';
  const action = state.directory ? 'Allow access' : 'Connect folder';
  els.notice.innerHTML = `<div class="notice">
    <div>${state.readError ? `<p role="alert">${escapeHTML(state.readError)}</p>` : ''}<strong>${state.directory ? `Reconnect ${escapeHTML(state.directory.name)}` : 'No worklog folder connected'}</strong><div class="notice-copy">${supportedText}</div></div>
    <button class="primary-btn" id="notice-connect" ${supportsFileSystemAccess ? '' : 'disabled'}>${action}</button>
  </div>`;
  document.querySelector('#notice-connect')?.addEventListener('click', state.directory ? requestExistingPermission : connectFolder);
}

function getHeader() {
  const weekInfo = getISOWeekInfo(state.cursor);
  const start = startOfISOWeek(state.cursor);
  const end = endOfISOWeek(state.cursor);
  if (state.view === 'week') return { eyebrow: 'Weekly journal', title: `Week ${weekInfo.week}`, subtitle: formatRange(start, end) };
  if (state.view === 'today') return { eyebrow: formatDate(state.cursor, { weekday: 'long' }), title: 'Today', subtitle: formatDate(state.cursor, { day: 'numeric', month: 'long', year: 'numeric' }) };
  if (state.view === 'month') return { eyebrow: 'Monthly view', title: formatDate(state.cursor, { month: 'long', year: 'numeric' }), subtitle: 'Entries, highlights and reflection' };
  if (state.view === 'analytics') return { eyebrow: 'Year in review', title: String(state.cursor.getFullYear()), subtitle: 'Activity and context for performance reviews' };
  if (state.view === 'search') return { eyebrow: 'Find anything', title: 'Search', subtitle: 'Search across entries, people, topics and content', navigation: false };
  if (state.view === 'people') return { eyebrow: 'Relationships', title: 'People', subtitle: 'Everyone mentioned in your work journal', navigation: false };
  if (state.view === 'topics') return { eyebrow: 'Context', title: 'Topics', subtitle: 'Projects, domains and recurring themes', navigation: false };
  return { eyebrow: 'Local-first', title: 'Settings', subtitle: 'Storage, portability and appearance', navigation: false };
}

function renderEmpty(title, copy, icon = '＋') {
  return `<div class="empty-state"><div class="empty-state-inner"><div class="empty-state-icon">${icon}</div><h2>${escapeHTML(title)}</h2><p>${escapeHTML(copy)}</p>${state.connected ? '<button class="primary-btn" data-add-entry>＋ Add entry</button>' : ''}</div></div>`;
}

function renderWeek() {
  const start = startOfISOWeek(state.cursor);
  const week = state.connected ? state.currentWeek : createEmptyWeek(state.cursor);
  const entries = sortEntries(week.entries || []);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const hasEntries = entries.length > 0;
  if (!state.connected && !hasEntries) return renderEmpty('Connect a local folder to begin', 'Your journal stays in portable weekly JSON files on your computer.', '⌂');
  return `<div class="week-card">${days.map(day => {
    const dateKey = toLocalDateInput(day);
    const dayEntries = entries.filter(entry => entry.date === dateKey);
    return `<section class="day-section">
      <div class="day-label"><div class="day-name">${formatDate(day, { weekday: 'short' })}</div><div class="day-date">${formatDate(day, { day: 'numeric', month: 'short' })}</div></div>
      <div class="day-entries">${dayEntries.length ? dayEntries.map(renderEntryRow).join('') : '<div class="day-empty">No entries</div>'}</div>
    </section>`;
  }).join('')}</div><div class="panel" style="margin-top:20px"><div class="setting-row"><div><h2>Weekly reflection</h2><p>Highlights, outcomes, challenges and learnings</p></div><button class="secondary-btn" id="edit-reflection">Edit reflection</button></div>${Object.entries(week.weeklyReflection).map(([key, items]) => detailSection(key[0].toUpperCase() + key.slice(1), items)).join('')}</div>`;
}

function renderEntryRow(entry) {
  const meta = ENTRY_META[entry.type] || ENTRY_META.note;
  const topics = normalizeList(entry.topics);
  return `<button class="entry-row" data-entry-id="${escapeHTML(entry.id)}">
    <div class="entry-time">${escapeHTML(entry.time || '—')}</div>
    <div class="entry-title"><div class="entry-title-line"><span class="entry-title-text">${escapeHTML(entry.title)}</span><span class="type-pill ${meta.className}">${meta.label}</span>${topics[0] ? `<span class="topic-pill">${escapeHTML(topics[0])}</span>` : ''}</div></div>
    <div class="entry-preview">${escapeHTML(entryPreview(entry))}</div>
  </button>`;
}

function renderToday() {
  const dateKey = toLocalDateInput(state.cursor);
  const entries = getAllKnownEntries().filter(entry => entry.date === dateKey);
  if (!entries.length) return renderEmpty('Nothing logged today', 'Capture a meeting, conversation, decision or piece of work while the context is fresh.');
  return `<div class="today-stack">${sortEntries(entries).map(entry => `<button class="today-entry" data-entry-id="${escapeHTML(entry.id)}"><div class="entry-time">${escapeHTML(entry.time || '—')}</div><div>${renderEntrySummary(entry)}</div></button>`).join('')}</div>`;
}

function renderEntrySummary(entry) {
  const meta = ENTRY_META[entry.type] || ENTRY_META.note;
  return `<div class="entry-title-line"><strong>${escapeHTML(entry.title)}</strong><span class="type-pill ${meta.className}">${meta.label}</span></div><div class="entry-preview" style="padding-top:6px">${escapeHTML(entryPreview(entry))}</div>`;
}

function renderMonth() {
  const month = state.cursor.getMonth();
  const year = state.cursor.getFullYear();
  const entries = getAllKnownEntries().filter(entry => {
    const d = parseLocalDate(entry.date);
    return d.getMonth() === month && d.getFullYear() === year;
  });
  return `<div class="month-tabs">
    ${['entries','highlights','reflections'].map(tab => `<button class="month-tab ${state.monthTab === tab ? 'active' : ''}" data-month-tab="${tab}">${tab[0].toUpperCase() + tab.slice(1)}</button>`).join('')}
  </div>${renderMonthTab(entries)}`;
}

function renderMonthTab(entries) {
  if (state.monthTab === 'entries') {
    if (!entries.length) return renderEmpty('No entries this month', 'Your weekly files will automatically appear here as you add entries.');
    return `<div class="month-list">${sortEntries(entries).map(entry => {
      const meta = ENTRY_META[entry.type] || ENTRY_META.note;
      return `<button class="month-row" data-entry-id="${escapeHTML(entry.id)}"><div class="month-date">${formatDate(parseLocalDate(entry.date), { weekday: 'short', day: 'numeric', month: 'short' })}</div><div class="month-time">${escapeHTML(entry.time || '—')}</div><div class="month-row-title">${escapeHTML(entry.title)}</div><div><span class="type-pill ${meta.className}">${meta.label}</span></div><div class="entry-preview">${escapeHTML(entryPreview(entry))}</div></button>`;
    }).join('')}</div>`;
  }
  const monthWeeks = state.allWeeks.filter(week => {
    const d = parseLocalDate(week.startDate);
    const e = parseLocalDate(week.endDate);
    return (d.getFullYear() === state.cursor.getFullYear() && d.getMonth() === state.cursor.getMonth()) || (e.getFullYear() === state.cursor.getFullYear() && e.getMonth() === state.cursor.getMonth());
  });
  if (state.monthTab === 'highlights') {
    const rows = monthWeeks.flatMap(week => (week.weeklyReflection?.highlights || []).map(text => ({ week: week.week, text })));
    return rows.length ? `<div class="panel"><h2>Highlights</h2>${rows.map(row => `<div class="setting-row"><div>${escapeHTML(row.text)}</div><div class="entity-meta">${escapeHTML(row.week)}</div></div>`).join('')}</div>` : renderEmpty('No highlights yet', 'Use weekly reflections to capture what mattered most.');
  }
  return `<div class="grid-cards">${monthWeeks.map(week => `<div class="entity-card"><div><div class="entity-name">${escapeHTML(week.week)}</div><div class="entity-meta">${(week.weeklyReflection?.outcomes || []).length} outcomes · ${(week.weeklyReflection?.learnings || []).length} learnings</div></div></div>`).join('') || '<div class="panel">No weekly reflections yet.</div>'}</div>`;
}

function renderSearch() {
  const entries = getAllKnownEntries();
  const query = state.search.trim().toLowerCase();
  const filtered = entries.filter(entry => {
    if (state.searchType !== 'all' && entry.type !== state.searchType) return false;
    if (!query) return true;
    const haystack = JSON.stringify(entry).toLowerCase();
    return haystack.includes(query);
  });
  return `<div class="search-toolbar"><div class="search-input-wrap"><span class="search-icon">⌕</span><input id="search-input" value="${escapeHTML(state.search)}" placeholder="Search entries, people, topics, or content…" /></div><div class="filter-row"><select id="search-type"><option value="all">All types</option>${Object.entries(ENTRY_META).map(([key, meta]) => `<option value="${key}" ${state.searchType === key ? 'selected' : ''}>${meta.label}</option>`).join('')}</select></div></div>
    <div class="entity-meta" style="margin-bottom:10px">${filtered.length} result${filtered.length === 1 ? '' : 's'}</div>
    <div class="search-results">${filtered.map(entry => {
      const meta = ENTRY_META[entry.type] || ENTRY_META.note;
      return `<button class="search-result" data-entry-id="${escapeHTML(entry.id)}"><div><div class="search-result-top"><span class="type-pill ${meta.className}">${meta.label}</span><span class="search-result-title">${escapeHTML(entry.title)}</span></div><div class="search-result-preview">${escapeHTML(entryPreview(entry))}</div></div><div class="search-result-date">${escapeHTML(entry.date)}</div></button>`;
    }).join('') || '<div class="panel">No matching entries.</div>'}</div>`;
}

function renderPeople() {
  const counts = new Map();
  getAllKnownEntries().forEach(entry => normalizeList(entry.participants).forEach(person => counts.set(person, (counts.get(person) || 0) + 1)));
  const rows = [...counts.entries()].sort((a,b) => b[1] - a[1]);
  if (!rows.length) return renderEmpty('No people yet', 'People mentioned in meetings and conversations will appear here.', '♙');
  return `<div class="grid-cards">${rows.map(([name,count]) => `<div class="entity-card"><div><div class="entity-name">${escapeHTML(name)}</div><div class="entity-meta">${count} entr${count === 1 ? 'y' : 'ies'}</div></div><button class="ghost-btn" data-search-person="${escapeHTML(name)}">Search</button></div>`).join('')}</div>`;
}

function renderTopics() {
  const counts = new Map();
  getAllKnownEntries().forEach(entry => normalizeList(entry.topics).forEach(topic => counts.set(topic, (counts.get(topic) || 0) + 1)));
  const rows = [...counts.entries()].sort((a,b) => b[1] - a[1]);
  if (!rows.length) return renderEmpty('No topics yet', 'Projects and recurring themes will appear here as you tag entries.', '◇');
  return `<div class="grid-cards">${rows.map(([name,count]) => `<div class="entity-card"><div><div class="entity-name">${escapeHTML(name)}</div><div class="entity-meta">${count} entr${count === 1 ? 'y' : 'ies'}</div></div><button class="ghost-btn" data-search-topic="${escapeHTML(name)}">Search</button></div>`).join('')}</div>`;
}

function renderAnalytics() {
  const year = state.cursor.getFullYear();
  const entries = getAllKnownEntries().filter(entry => parseLocalDate(entry.date).getFullYear() === year);
  const counts = { meeting: 0, work: 0, decision: 0 };
  entries.forEach(entry => { if (entry.type in counts) counts[entry.type] += 1; });
  const months = Array.from({ length: 12 }, (_, month) => entries.filter(entry => parseLocalDate(entry.date).getMonth() === month).length);
  const max = Math.max(...months, 1);
  const currentMonth = new Date().getFullYear() === year ? new Date().getMonth() : -1;
  return `<div class="analytics-grid">
    ${stat(entries.length, 'Total entries')}${stat(counts.meeting, 'Meetings')}${stat(counts.work, 'Work entries')}${stat(counts.decision, 'Decisions')}
  </div><div class="panel chart-panel"><div class="chart-title">Entries per month</div><div class="bar-chart">${months.map((count,index) => `<div class="bar-wrap"><div class="bar ${index === currentMonth ? 'active' : ''}" style="height:${Math.max(2, Math.round((count/max)*155))}px" title="${count} entries"></div><div class="bar-label">${formatDate(new Date(year,index,1), { month: 'short' })}</div></div>`).join('')}</div></div>`;
}

function stat(number, label) { return `<div class="stat-card"><div class="stat-number">${number}</div><div class="stat-label">${label}</div></div>`; }

function renderSettings() {
  const selectedTheme = localStorage.getItem('worklog-theme') || 'system';
  return `<div class="settings-grid"><div class="panel"><h2>Local storage</h2><p>The weekly JSON files in your chosen folder are the source of truth.</p>
    <div class="setting-row"><div><div class="setting-title">Worklog folder</div><div class="setting-copy">${state.directory ? escapeHTML(state.directory.name) : 'No folder selected'}</div></div><div class="button-row"><button class="secondary-btn" id="settings-connect">${state.directory ? 'Change folder' : 'Connect folder'}</button>${state.directory ? '<button class="ghost-btn" id="settings-forget">Forget</button>' : ''}</div></div>
    <div class="setting-row"><div><div class="setting-title">Import / restore JSON</div><div class="setting-copy">Import weekly files or a full backup. Replacements require confirmation; previous versions are retained in history/.</div></div><button class="secondary-btn" id="settings-import" ${state.connected ? '' : 'disabled'}>Import</button></div>
    <div class="setting-row"><div><div class="setting-title">Full backup</div><div class="setting-copy">Download all weekly files as one portable JSON backup.</div></div><button class="secondary-btn" id="settings-backup" ${state.connected ? '' : 'disabled'}>Export backup</button></div>
  </div><div class="panel"><h2>Appearance</h2><p>Choose how WorkLog looks on this browser.</p><div class="field"><label>Theme</label><select id="theme-select"><option value="system" ${selectedTheme==='system'?'selected':''}>System</option><option value="light" ${selectedTheme==='light'?'selected':''}>Light</option><option value="dark" ${selectedTheme==='dark'?'selected':''}>Dark</option></select></div><div class="setting-row"><div><div class="setting-title">Data model</div><div class="setting-copy">Schema version 1 · one JSON file per ISO week</div></div></div><div class="setting-row"><div><div class="setting-title">Keyboard shortcut</div><div class="setting-copy">Press N anywhere outside a form to add an entry.</div></div></div></div></div>`;
}

function getAllKnownEntries() {
  const source = [...state.allWeeks.filter(week => week.week !== state.currentWeek.week), state.currentWeek];
  return sortEntries(source.flatMap(week => week.entries || []));
}

function findEntry(id) {
  const entries = getAllKnownEntries();
  return entries.find(entry => entry.id === id) || state.currentWeek.entries?.find(entry => entry.id === id);
}

function bindRenderedEvents() {
  document.querySelectorAll('[data-entry-id]').forEach(node => node.addEventListener('click', () => openEntryDetail(findEntry(node.dataset.entryId))));
  document.querySelectorAll('[data-add-entry]').forEach(node => node.addEventListener('click', openEntryTypeModal));
  document.querySelectorAll('[data-month-tab]').forEach(node => node.addEventListener('click', () => { state.monthTab = node.dataset.monthTab; render(); }));

  document.querySelector('#search-input')?.addEventListener('input', event => { state.search = event.target.value; renderSearchIntoContentPreservingFocus(); });
  document.querySelector('#search-type')?.addEventListener('change', event => { state.searchType = event.target.value; render(); });
  document.querySelectorAll('[data-search-person]').forEach(btn => btn.addEventListener('click', () => { state.search = btn.dataset.searchPerson; state.view='search'; render(); }));
  document.querySelectorAll('[data-search-topic]').forEach(btn => btn.addEventListener('click', () => { state.search = btn.dataset.searchTopic; state.view='search'; render(); }));

  document.querySelector('#edit-reflection')?.addEventListener('click', openReflectionForm);
  document.querySelector('#settings-connect')?.addEventListener('click', connectFolder);
  document.querySelector('#settings-forget')?.addEventListener('click', async () => { await forgetDirectory(); state.directory=null; state.connected=false; state.allWeeks=[]; render(); });
  document.querySelector('#settings-import')?.addEventListener('click', importFiles);
  document.querySelector('#settings-backup')?.addEventListener('click', async () => {
    try { downloadBackup(await readAllWeeks(state.directory)); toast('Backup exported.'); }
    catch (error) { state.readError = error.message; toast(error.message, true); els.notice.innerHTML = `<div class="notice" role="alert">${escapeHTML(error.message)}</div>`; }
  });
  document.querySelector('#theme-select')?.addEventListener('change', event => { localStorage.setItem('worklog-theme', event.target.value); applyTheme(event.target.value); });
}

function renderSearchIntoContentPreservingFocus() {
  const selection = document.querySelector('#search-input')?.selectionStart;
  els.content.innerHTML = renderSearch();
  bindRenderedEvents();
  const input = document.querySelector('#search-input');
  input?.focus();
  if (selection != null) input?.setSelectionRange(selection, selection);
}

async function importFiles() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json'; input.multiple = true;
  input.addEventListener('change', async () => {
    try {
      if (!input.files?.length) return;
      const plan = await inspectImportFiles([...input.files]);
      const conflicts = await getImportConflicts(state.directory, plan);
      if (conflicts.length && !confirm(`Replace ${conflicts.length} existing week(s): ${conflicts.join(', ')}? This replaces their entries and reflections. Previous versions will be preserved in history/ or recovery/.`)) return;
      const imported = await applyImport(state.directory, plan, { overwrite: conflicts.length > 0 });
      toast(`Imported ${imported.length} weekly file${imported.length===1?'':'s'}.`);
      await refreshData(true);
    } catch (error) { toast(error.message, true); }
  });
  input.click();
}

function openEntryTypeModal() {
  if (!state.connected) {
    if (state.directory) requestExistingPermission(); else connectFolder();
    return;
  }
  setModal(`<div class="modal-backdrop"><div class="modal modal-sm"><div class="modal-header"><h2>Add an entry</h2><button class="close-btn" data-close-modal>×</button></div><div class="modal-body"><div class="entry-type-grid">${Object.entries(ENTRY_META).map(([type, meta]) => `<button class="entry-type-choice" data-entry-type="${type}"><span class="choice-icon ${meta.className}">${meta.icon}</span><span class="choice-label">${meta.label}</span><span class="choice-description">${meta.description}</span></button>`).join('')}</div></div></div></div>`);
  els.modal.querySelectorAll('[data-entry-type]').forEach(button => button.addEventListener('click', () => openEntryForm(button.dataset.entryType)));
}

function entryFields(type, entry = {}) {
  const base = `<div class="field span-2"><label>Title</label><input name="title" required value="${escapeHTML(entry.title || '')}" placeholder="Short, specific description" /></div>
    <div class="field"><label>Date</label><input type="date" name="date" required value="${escapeHTML(entry.date || toLocalDateInput(state.cursor))}" /></div>
    <div class="field"><label>Time</label><input type="time" name="time" value="${escapeHTML(entry.time || new Date().toTimeString().slice(0,5))}" /></div>
    <div class="field"><label>People</label><input name="participants" value="${escapeHTML(normalizeList(entry.participants).join(', '))}" placeholder="Anna, Johan" /></div>
    <div class="field"><label>Topics</label><input name="topics" value="${escapeHTML(normalizeList(entry.topics).join(', '))}" placeholder="Architecture, Platform" /></div>`;
  const textArea = (name, label, value, help = 'One item per line') => `<div class="field span-2"><label>${label}</label><textarea name="${name}">${escapeHTML(joinLines(value))}</textarea><div class="field-help">${help}</div></div>`;
  const simpleArea = (name, label, value, placeholder='') => `<div class="field span-2"><label>${label}</label><textarea name="${name}" placeholder="${escapeHTML(placeholder)}">${escapeHTML(value || '')}</textarea></div>`;
  if (type === 'meeting') return base + textArea('discussion','Discussion',entry.discussion) + textArea('contribution','My contribution',entry.contribution) + textArea('decisions','Decisions',entry.decisions) + textArea('followUps','Follow-ups',(entry.followUps || []).map(x => `${x.text}${x.reference ? ` | ${x.reference}` : ''}`),'One per line. Optional reference after | e.g. Create spike | ABC-123') + simpleArea('references','References',(entry.references || []).map(x=>x.value).join('\n'),'One Jira key, URL or document reference per line');
  if (type === 'work') return base + simpleArea('summary','What did you do?',entry.summary,'Describe the work in your own words') + textArea('details','Details',entry.details) + simpleArea('outcome','Outcome',entry.outcome,'What changed or became possible?') + simpleArea('references','References',(entry.references || []).map(x=>x.value).join('\n'));
  if (type === 'conversation') return base + simpleArea('summary','Summary',entry.summary,'What was the conversation about?') + textArea('notes','Notes',entry.notes) + textArea('contribution','My contribution',entry.contribution);
  if (type === 'decision') return base + simpleArea('decision','Decision',entry.decision,'What was decided?') + simpleArea('context','Context',entry.context,'What led to this decision?') + simpleArea('rationale','Rationale',entry.rationale,'Why this option?');
